name: "Build"

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    name: PHP ${{ matrix.php }} with ${{ matrix.dependencies }} deps
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        dependencies:
          - "lowest"
          - "highest"
        php:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
        os:
          - "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: none
          php-version: "${{ matrix.php }}"
          ini-values: memory_limit=-1

      - name: "Update Composer platform version"
        if: ${{ matrix.php != '8.1' }}
        shell: bash
        run: "composer config platform.php ${{ matrix.php }}"

      - name: "Install dependencies"
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: "${{ matrix.dependencies }}"

      - name: "Check code style"
        if: ${{ matrix.dependencies == 'highest' && matrix.php == '8.1' }}
        run: composer code-style:check

      - name: "Run psalm"
        if: ${{ matrix.dependencies == 'highest' || matrix.php != '8.4' }}
        run: vendor/bin/psalm

      - name: "Run phpunit"
        run: vendor/bin/phpunit

      - name: "Run phpbench"
        if: ${{ matrix.dependencies == 'highest' || matrix.php != '8.4' }}
        run: vendor/bin/phpbench run
